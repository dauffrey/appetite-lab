name: Validate research baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run provenance validator tests
        run: python -m unittest tools/test_validate_research.py
      - name: Validate provenance manifests
        run: python tools/validate_research.py
